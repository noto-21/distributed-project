# External entry point. /<branch>/... is load-balanced across that branch's replicas with the prefix stripped,
# e.g. GET /ajax/healthz -> one of branch-ajax:3000/healthz.

# Docker's internal DNS. `resolve` below re-queries it, so `docker compose up --scale` changes are picked up without a reload.
resolver 127.0.0.11 valid=10s ipv6=off;

# Round-robin by default. max_fails/fail_timeout: skip a replica for 10s after 2 failed requests.
upstream ajax_pool {
    zone ajax_pool 64k;
    server branch-ajax:3000 resolve max_fails=2 fail_timeout=10s;
}
upstream oshawa_pool {
    zone oshawa_pool 64k;
    server branch-oshawa:3000 resolve max_fails=2 fail_timeout=10s;
}
upstream whitby_pool {
    zone whitby_pool 64k;
    server branch-whitby:3000 resolve max_fails=2 fail_timeout=10s;
}
# The single entry for the app: any replica of any branch. Signed-in requests are forwarded by the backend
# to the user's home branch, so the client never chooses one.
upstream all_branches {
    zone all_branches 64k;
    server branch-ajax:3000 resolve max_fails=2 fail_timeout=10s;
    server branch-oshawa:3000 resolve max_fails=2 fail_timeout=10s;
    server branch-whitby:3000 resolve max_fails=2 fail_timeout=10s;
}

server {
    listen 80;

    # Peer-only endpoints: branches call each other directly on the Docker network, never via the gateway.
    # Regex locations win over the prefix locations below, so this catches /ajax/internal/... too.
    location ~ /internal(/|$) {
        return 403;
    }

    location = /gateway-health {
        access_log off;
        return 200 "ok\n";
    }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $request_id;

    # Retry the next replica if one is down or not ready (/healthz returns 503 without a DB).
    # Not on POST by default (non_idempotent is off), so a borrow is never sent twice.
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
    # A stopped container's IP doesn't refuse, it just hangs; the 60s default would surface as a 504.
    proxy_connect_timeout 2s;

    # App entry: /api/... as-is (no prefix to strip). A branch that receives a request for another
    # branch's user forwards it there, and that can take a search fan-out plus a transfer.
    location /api/    { proxy_pass http://all_branches; proxy_read_timeout 30s; }

    # Per-branch entries: health checks, Google callbacks, the demo, direct access.
    location /ajax/   { proxy_pass http://ajax_pool/; }
    location /oshawa/ { proxy_pass http://oshawa_pool/; }
    location /whitby/ { proxy_pass http://whitby_pool/; }
}
