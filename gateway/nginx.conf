# External entry point. /<branch>/... is proxied to that branch with the prefix stripped,
# e.g. GET /ajax/healthz -> branch-ajax:3000/healthz.
server {
    listen 80;

    # Peer-only endpoints: branches call each other directly on the Docker network, never via the gateway.
    # Regex locations win over the prefix locations below, so this catches /ajax/internal/... too.
    location ~ /internal(/|$) {
        return 403;
    }

    location = /gateway-health {
        access_log off;
        return 200 "ok\n";
    }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $request_id;

    location /ajax/   { proxy_pass http://branch-ajax:3000/; }
    location /oshawa/ { proxy_pass http://branch-oshawa:3000/; }
    location /whitby/ { proxy_pass http://branch-whitby:3000/; }
}
