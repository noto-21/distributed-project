# Shared settings for the 3 branch containers. Each branch overrides only its own env.
# Each branch's DB is its own MongoDB Atlas cluster; connection strings come from the root .env (see .env.example).
x-branch: &branch
  build: ./server
  # -L (polling): file events from a Windows/macOS bind mount don't reach the container otherwise.
  command: ["npx", "nodemon", "-L", "src/server.js"]
  volumes:
    - ./server/src:/app/src
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 15s

x-branch-env: &branch-env
  NODE_ENV: development
  PORT: 3000
  JWT_SECRET: dev-secret-change-in-prod
  PEER_TIMEOUT_MS: 800

services:
  # --- L7 Load Balancer & Edge Gateway ---
  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/gateway-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    # service_started, not service_healthy: the gateway should come up even while a branch is down.
    depends_on:
      branch-ajax: { condition: service_started }
      branch-oshawa: { condition: service_started }
      branch-whitby: { condition: service_started }

  # --- Branch 1: Oshawa ---
  branch-oshawa:
    <<: *branch
    environment:
      <<: *branch-env
      BRANCH_ID: oshawa
      MONGO_URI: ${MONGO_URI_OSHAWA:?set MONGO_URI_OSHAWA in .env}
      PEER_URLS: ajax=http://branch-ajax:3000,whitby=http://branch-whitby:3000

  # --- Branch 2: Ajax ---
  branch-ajax:
    <<: *branch
    environment:
      <<: *branch-env
      BRANCH_ID: ajax
      MONGO_URI: ${MONGO_URI_AJAX:?set MONGO_URI_AJAX in .env}
      PEER_URLS: oshawa=http://branch-oshawa:3000,whitby=http://branch-whitby:3000

  # --- Branch 3: Whitby ---
  branch-whitby:
    <<: *branch
    environment:
      <<: *branch-env
      BRANCH_ID: whitby
      MONGO_URI: ${MONGO_URI_WHITBY:?set MONGO_URI_WHITBY in .env}
      PEER_URLS: oshawa=http://branch-oshawa:3000,ajax=http://branch-ajax:3000
