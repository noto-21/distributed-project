name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # Throwaway Mongo for tests; CI never touches the Atlas clusters.
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    env:
      BRANCH_ID: ajax
      MONGO_URI: mongodb://localhost:27017/library_test
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    env:
      # Placeholders so compose interpolation passes; nothing connects to them.
      MONGO_URI_AJAX: mongodb://placeholder/library_ajax
      MONGO_URI_OSHAWA: mongodb://placeholder/library_oshawa
      MONGO_URI_WHITBY: mongodb://placeholder/library_whitby
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker build server
